name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/amazing-johnson-5v2pja, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ vars.WAITLIST_ENDPOINT == '' }}
        run: echo "::warning::WAITLIST_ENDPOINT is not set, so the landing page waitlist will not collect signups. See README → Connecting the waitlist."
      - run: npm run build
        env:
          # Formspree (or compatible) endpoint for waitlist signups.
          # Set under Settings → Secrets and variables → Actions → Variables.
          VITE_WAITLIST_ENDPOINT: ${{ vars.WAITLIST_ENDPOINT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
